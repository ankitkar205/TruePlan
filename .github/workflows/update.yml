name: Update tariffs
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python update_plans.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: debug-pages, path: debug/ }
      - run: |
          git config user.name "tariff-bot"
          git config user.email "bot@users.noreply.github.com"
          git add plans.json alerts.json
          git diff --staged --quiet || (git commit -m "Update tariffs" && git push)
